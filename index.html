<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavishya Enterprise - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .company-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            margin: 0 auto 20px;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-login {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="company-logo">BE</div>
        <h3 class="text-center mb-2">Bhavishya Enterprise</h3>
        <p class="text-center text-muted mb-4">Crane Service Management System</p>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required placeholder="Enter username" value="admin">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Enter password" value="admin123">
            </div>
            
            <button type="submit" class="btn btn-login btn-primary w-100 mt-3">
                <span id="loginBtnText">Login</span>
                <span id="loginLoading" class="loading hidden"></span>
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <p class="mb-2"><strong>Default Login:</strong></p>
            <p class="mb-1">Username: admin</p>
            <p class="mb-0">Password: admin123</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            if (localStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }
            
            // Login form handler
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Show loading
                document.getElementById('loginBtnText').classList.add('hidden');
                document.getElementById('loginLoading').classList.remove('hidden');
                
                // Simple authentication
                setTimeout(() => {
                    if (username === 'admin' && password === 'admin123') {
                        // Set login flag
                        localStorage.setItem('loggedIn', 'true');
                        localStorage.setItem('currentUser', JSON.stringify({
                            username: 'admin',
                            fullName: 'Administrator',
                            role: 'admin'
                        }));
                        
                        // Redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Invalid credentials! Use:\nUsername: admin\nPassword: admin123');
                        document.getElementById('loginBtnText').classList.remove('hidden');
                        document.getElementById('loginLoading').classList.add('hidden');
                    }
                }, 500);
            });
        });
    </script>
</body>
</html>
