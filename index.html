<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavishya Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 20px;
        }
        
        .hidden {
            display: none;
        }
        
        .btn-login {
            background: linear-gradient(45deg, #2c3e50, #3498db);
            border: none;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">BE</div>
        <h3 class="text-center mb-4">Bhavishya Enterprise</h3>
        <p class="text-center text-muted mb-4">Crane Service Management</p>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" value="admin" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="admin123" required>
            </div>
            
            <button type="submit" class="btn btn-login btn-primary w-100 mt-3">
                <span id="loginText">Login</span>
                <span id="loading" class="spinner-border spinner-border-sm hidden"></span>
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <p class="mb-2"><strong>Test Accounts:</strong></p>
            <p class="mb-1">Admin: admin / admin123</p>
            <p class="mb-0">Operator: operator / operator123</p>
        </div>
        
        <div class="mt-4 text-center">
            <button class="btn btn-sm btn-outline-secondary" onclick="setupFirebase()">
                Setup Firebase
            </button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loginText').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            // Simple check
            setTimeout(() => {
                if ((username === 'admin' && password === 'admin123') || 
                    (username === 'operator' && password === 'operator123')) {
                    
                    // Create user object
                    const user = {
                        username: username,
                        fullName: username === 'admin' ? 'Administrator' : 'Crane Operator',
                        role: username === 'admin' ? 'admin' : 'operator',
                        email: username + '@bhavishya.com'
                    };
                    
                    // Save to session
                    sessionStorage.setItem('user', JSON.stringify(user));
                    
                    // Redirect to main app
                    window.location.href = 'main.html';
                    
                } else {
                    alert('Wrong username or password!\n\nTry:\n- admin / admin123\n- operator / operator123');
                    document.getElementById('loginText').classList.remove('hidden');
                    document.getElementById('loading').classList.add('hidden');
                }
            }, 1000);
        });
        
        function setupFirebase() {
            window.open('https://console.firebase.google.com/', '_blank');
            alert('Open Firebase Console to:\n1. Enable Authentication → Email/Password\n2. Add users\n\nThen come back here.');
        }
    </script>
</body>
</html>
